<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi PSHT</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4 font-sans text-gray-200">

    <!-- Card Container -->
    <div class="bg-gray-900 border border-red-900/50 rounded-2xl shadow-[0_0_20px_rgba(220,38,38,0.15)] w-full max-w-sm overflow-hidden relative">
        
        <!-- Header Design -->
        <div class="bg-gradient-to-r from-red-800 to-red-600 p-6 text-center relative overflow-hidden">
            <!-- Decorative circle -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-5 rounded-full"></div>
            
            <h1 class="text-2xl font-black text-white tracking-widest drop-shadow-md">PRESENSI SISWA</h1>
            <p class="text-red-100 text-sm mt-1 font-medium">Jadwal: Rabu & Sabtu (19.22 WIB)</p>
        </div>

        <div id="mainContent" class="p-6">
            <!-- Alert Info (Sembunyi secara default) -->
            <div id="alertBox" class="hidden mb-5 text-center p-4 rounded-lg border"></div>

            <!-- Form Absen -->
            <form id="formAbsen" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-400 mb-2">Nomor Induk Siswa (NIS)</label>
                    <input type="text" id="inputNis" placeholder="Contoh: 2025001" required 
                           class="w-full bg-gray-950 border border-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all text-center tracking-widest font-mono text-lg placeholder-gray-600">
                </div>

                <button type="submit" id="btnSubmit" 
                        class="w-full bg-red-700 hover:bg-red-600 active:bg-red-800 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-red-900/50 transition-all transform hover:-translate-y-0.5">
                    KONFIRMASI HADIR
                </button>
            </form>
        </div>
        
        <!-- Footer -->
        <div class="bg-gray-950 py-3 text-center text-xs text-gray-600">
            Sistem Terkunci Otomatis @ 18.30 WIB
        </div>
    </div>

    <script>
        // Logika Validasi Hari dan Waktu
        const validasiJadwal = () => {
            const sekarang = new Date();
            const hari = sekarang.getDay(); // 0:Minggu, 1:Senin, 2:Selasa, 3:Rabu, 4:Kamis, 5:Jumat, 6:Sabtu
            const jam = sekarang.getHours();
            const menit = sekarang.getMinutes();

            const formElement = document.getElementById('formAbsen');
            const alertBox = document.getElementById('alertBox');

            const tampilkanPesan = (pesan, tipe) => {
                formElement.classList.add('hidden');
                alertBox.classList.remove('hidden');
                if(tipe === 'error') {
                    alertBox.className = 'mb-5 text-center p-4 rounded-lg border border-red-800 bg-red-950 text-red-400 font-medium';
                }
                alertBox.innerHTML = pesan;
            };

            // 1. Validasi Hari: Hanya Rabu (3) dan Sabtu (6)
            if (hari !== 3 && hari !== 6) {
                tampilkanPesan('❌<br><br>Hari ini bukan jadwal latihan.<br><span class="text-xs text-gray-400 mt-2 block">Jadwal latihan hanya hari Rabu dan Sabtu.</span>', 'error');
                return false;
            }

            // 2. Validasi Waktu: Kunci tepat di jam 18:30 (atau lebih)
            const waktuSekarangMins = (jam * 60) + menit;
            const batasWaktuMins = (18 * 60) + 30; // 18.30 diubah ke menit

            if (waktuSekarangMins >= batasWaktuMins) {
                tampilkanPesan('🔒<br><br>Sistem Telah Dikunci!<br><span class="text-xs text-gray-400 mt-2 block">Batas waktu absensi mandiri adalah pukul 18.30 WIB. Silakan melapor ke pelatih.</span>', 'error');
                return false;
            }

            return true;
        };

        // Jalankan saat halaman dibuka
        const isBuka = validasiJadwal();

        // Eksekusi jika form disubmit
        document.getElementById('formAbsen').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validasi ulang (mencegah user membuka halaman sejak sore lalu submit di malam hari)
            if (!validasiJadwal()) return;

            const nis = document.getElementById('inputNis').value.trim();
            const tombol = document.getElementById('btnSubmit');

            // Efek loading tombol
            tombol.innerHTML = 'MEMPROSES...';
            tombol.classList.add('opacity-50', 'cursor-not-allowed');

            try {
       https://azoksmzduifvalgicozc.supabase.co
                
                // Jika sukses:
                document.getElementById('mainContent').innerHTML = `
                    <div class="text-center py-6">
                        <div class="w-16 h-16 bg-green-900/30 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-green-700">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h2 class="text-xl font-bold text-white mb-2">TERCATAT!</h2>
                        <p class="text-gray-400 text-sm">Kehadiranmu sudah masuk ke sistem.<br>Sampai jumpa pukul 19.22 WIB.</p>
                    </div>
                `;

            } catch (err) {
                alert('Terjadi kesalahan jaringan.');
                tombol.innerHTML = 'KONFIRMASI HADIR';
                tombol.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
